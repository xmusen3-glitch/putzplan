<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Putzplan</title>
<meta name="description" content="Unser Familien-Putzplan mit Vorher-Nachher-Fotos">
<meta name="theme-color" content="#7c5cff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Putzplan">
<style>
:root{
  --bg:#f6f4ff; --card:#ffffff; --ink:#1d1b2e; --muted:#6b6886; --line:#e6e2f5;
  --brand:#7c5cff; --brand-ink:#fff; --ok:#1fa96b; --warn:#f0a019; --bad:#e2445c; --soft:#efeaff;
  --shadow:0 2px 10px rgba(40,20,120,.08);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#14121f; --card:#1f1c2e; --ink:#f1efff; --muted:#a29fbf; --line:#2f2b45; --soft:#2a2540; --shadow:none; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#app{max-width:640px;margin:0 auto;padding:12px 16px calc(16px + env(safe-area-inset-top))}
header.top{display:flex;align-items:center;gap:10px;padding:calc(6px + env(safe-area-inset-top)) 0 10px}
header.top h1{font-size:22px;margin:0;flex:1}
.pill{display:inline-flex;align-items:center;gap:4px;background:var(--soft);border-radius:99px;padding:3px 10px;font-size:13px;font-weight:600;white-space:nowrap}
.card{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow);border:1px solid var(--line);margin:10px 0}
.banner{border-radius:16px;padding:14px;margin:10px 0;background:linear-gradient(135deg,#7c5cff,#ff6fae);color:#fff;font-weight:600}
.banner.wash{background:linear-gradient(135deg,#1aa3e0,#29d3a6)}
h2{font-size:18px;margin:22px 0 6px;display:flex;align-items:center;gap:8px}
h2 small{font-weight:500;color:var(--muted);font-size:13px}
.task{display:flex;gap:12px;align-items:center}
.task .ico{font-size:26px;width:40px;height:40px;border-radius:12px;background:var(--soft);display:grid;place-items:center;flex:none}
.task .body{flex:1;min-width:0}
.task .title{font-weight:650}
.task .meta{font-size:13px;color:var(--muted);margin-top:2px}
.task.done{opacity:.7}
.task.done .title{text-decoration:line-through}
.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:700;background:var(--brand);color:var(--brand-ink);display:inline-flex;align-items:center;gap:6px;justify-content:center;min-height:44px}
.btn.sec{background:var(--soft);color:var(--ink)}
.btn.ok{background:var(--ok)}
.btn.bad{background:var(--bad)}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn.big{width:100%;font-size:17px;padding:15px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}
.center{text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.who{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px 8px;text-align:center;font-weight:700}
.who .e{font-size:40px;display:block}
.pin{display:flex;gap:12px;justify-content:center;margin:18px 0}
.pin span{width:18px;height:18px;border-radius:50%;border:2px solid var(--brand)}
.pin span.f{background:var(--brand)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:0 auto}
.pad button{font-size:24px;font-weight:700;padding:16px 0;border-radius:16px;border:1px solid var(--line);background:var(--card)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs button{flex:1;max-width:160px;background:none;border:0;padding:8px 0 10px;font-size:12px;color:var(--muted);font-weight:600}
nav.tabs button b{display:block;font-size:22px;line-height:1.2}
nav.tabs button.on{color:var(--brand)}
label.f{display:block;margin:10px 0 4px;font-weight:600;font-size:14px}
input[type=text],input[type=number],input[type=url],input[type=password],select,textarea{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.chk{display:flex;gap:10px;align-items:center;margin:10px 0}
.chk input{width:22px;height:22px}
.thumbs{display:flex;gap:8px;margin-top:10px}
.thumbs figure{margin:0;flex:1;position:relative}
.thumbs img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;background:var(--soft);display:block}
.thumbs figcaption{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;font-weight:700;padding:2px 6px;border-radius:6px}
.bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1d1b2e;color:#fff;padding:12px 16px;border-radius:14px;font-weight:600;z-index:50;max-width:90vw;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.overlay{position:fixed;inset:0;background:#000;z-index:40;display:flex;flex-direction:column}
.overlay video,.overlay img.prev{flex:1;width:100%;min-height:0;object-fit:contain;background:#000}
.overlay .cap{color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;font-weight:700;text-align:center}
.overlay .cap .tag{display:inline-block;background:#ff6fae;border-radius:8px;padding:2px 8px;margin-bottom:4px}
.overlay .cap .tag.after{background:#1fa96b}
.overlay .ctl{display:flex;justify-content:space-around;align-items:center;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.shutter{width:76px;height:76px;border-radius:50%;border:5px solid #fff;background:#ff6fae}
.ctl .btn{min-width:90px}
.modal{position:fixed;inset:0;background:rgba(10,8,25,.55);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.modal .sheet{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.list-item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.tagx{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--soft)}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:3px;margin:8px 0}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:10px;font-weight:600;font-size:14px}
.seg button.on{background:var(--card);box-shadow:var(--shadow)}
.big-emoji{font-size:56px;text-align:center;margin:20px 0 6px}
details summary{cursor:pointer;font-weight:700;padding:6px 0}
img.zoom{max-width:100%;border-radius:12px}
.rain{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.rain span{position:absolute;top:-60px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(calc(100vh + 80px)) rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.rain{display:none}}
</style>
</head>
<body>
<div id="app"><p class="center muted" style="margin-top:40vh">Lädt… 🧽</p></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
<script type="module" src="app.js"></script>
</body>
</html>
