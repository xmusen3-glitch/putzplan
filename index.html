<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Der Putzplan ist umgezogen</title>
<!--
  Diese Datei gehört NICHT zur App (die liegt in web/). Sie ist die Seite hinter der alten Adresse
  xmusen3-glitch.github.io/putzplan (GitHub Pages) und schickt alle zur neuen: https://dokas-family.com
  Die alte Version (V1) liegt im Branch v1-archiv.
-->
<noscript><meta http-equiv="refresh" content="0; url=https://dokas-family.com/"></noscript>
<link rel="canonical" href="https://dokas-family.com/">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f3ff;color:#1e1b33;font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}
  @media (prefers-color-scheme:dark){body{background:#13111d;color:#f2f0ff}}
  main{padding:24px;max-width:420px}
  a{display:inline-block;margin-top:14px;padding:12px 18px;border-radius:12px;background:#7c5cff;color:#fff;font-weight:800;text-decoration:none;box-shadow:0 3px 0 #5b3fd9}
</style>
</head>
<body>
<main>
  <h1>Der Putzplan ist umgezogen</h1>
  <p>Die neue Version läuft unter <b>dokas-family.com</b>. Den neuen Einladungslink bekommst du von den Admins der Familie.</p>
  <a href="https://dokas-family.com/">Zur neuen Version</a>
</main>
<script>
  (async () => {
    let ziel = 'https://dokas-family.com/';
    // Die alte App hat sich auf diesem Gerät gemerkt, zu welcher Familie es gehört und wer angemeldet war
    // (oder die Familie steht noch im alten Einladungslink). Das geben wir der neuen App mit: Sie nimmt das
    // Gerät dann von selbst auf und zeigt gleich den richtigen Namen. Die PIN wird dort trotzdem abgefragt.
    try {
      let conf = JSON.parse(localStorage.getItem('pp_conf') || 'null');
      const link = /join=([\w-]+)/.exec(location.hash);
      if (!conf?.f && link) conf = JSON.parse(decodeURIComponent(escape(atob(link[1].replace(/-/g, '+').replace(/_/g, '/')))));
      if (conf?.f) {
        const pack = JSON.stringify({ f: conf.f, me: JSON.parse(localStorage.getItem('pp_me') || 'null') });
        ziel += '#umzug=' + btoa(pack).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      }
    } catch {}
    // Reste der alten App wegräumen (Service Worker, Zwischenspeicher), dann weiter
    try {
      for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister();
      for (const k of await caches.keys()) await caches.delete(k);
    } catch {}
    location.replace(ziel);
  })();
</script>
</body>
</html>
