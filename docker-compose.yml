# Putzplan hinter dem Nginx Proxy Manager: kein Port nach außen, der Proxy erreicht den Dienst als "putzplan:8080".
# Die Werte für APP_URL und PUSH_CONTACT stehen in der Datei .env neben dieser Datei (siehe .env.example).
services:
  putzplan:
    build: .
    container_name: putzplan
    restart: unless-stopped
    environment:
      TZ: Europe/Berlin
      # Adresse der App, z. B. https://dokas-family.com (für Einladungslinks und die Weiterleitung von www)
      APP_URL: ${APP_URL:-}
      # Kontaktangabe für die Push-Dienste von Apple und Google (Pflicht): eine https-Adresse oder mailto:
      PUSH_CONTACT: ${PUSH_CONTACT:-${APP_URL:-mailto:putzplan@example.com}}
    volumes:
      - ./data:/data
    networks:
      - proxy

networks:
  proxy:
    external: true
