<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Putzplan V2 – Konzept</title>
<style>
:root{
  --bg:#f5f3ff;--card:#fff;--ink:#1e1b33;--muted:#6d6a88;--line:#e4dff7;--edge:#d3cbf0;--soft:#efeaff;
  --brand:#7c5cff;--brand-d:#5b3fd9;--ok:#23a86d;--ok-d:#19804f;--warn:#f0a51e;--warn-d:#c07d06;--bad:#e5486a;--bad-d:#b72f4d;--info:#2e9fe6;--info-d:#1c7fc0;
  --brand-t:#5b3fd9;--ok-t:#19804f;--warn-t:#935a00;--bad-t:#b72f4d;--info-t:#1c6fa8;
}
html[data-theme=dark]{
  --bg:#13111d;--card:#211e33;--ink:#f2f0ff;--muted:#a9a5c7;--line:#342f4f;--edge:#0c0a14;--soft:#2c2746;
  --brand-t:#b3a2ff;--ok-t:#5fd6a0;--warn-t:#ffc45e;--bad-t:#ff8fa6;--info-t:#7cc8f7;
}
*{box-sizing:border-box}
html{color-scheme:light}html[data-theme=dark]{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
h1{font-size:22px;font-weight:800;margin:0}
h2{font-size:15px;font-weight:800;margin:0 0 8px;display:flex;align-items:center;gap:8px}
small,.sub{display:block;color:var(--muted);font-size:12.5px;margin:0}
b{font-weight:700}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.s{width:16px;height:16px}.ic.xs{width:12px;height:12px;stroke-width:3}.ic.big{width:44px;height:44px}
.grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:10px}
.c-brand{--c:var(--brand);--ct:var(--brand-t)}.c-ok{--c:var(--ok);--ct:var(--ok-t)}.c-warn{--c:var(--warn);--ct:var(--warn-t)}.c-bad{--c:var(--bad);--ct:var(--bad-t)}.c-info{--c:var(--info);--ct:var(--info-t)}

/* Konzept-Leiste */
.pbar{position:sticky;top:0;z-index:20;display:flex;gap:10px;align-items:center;padding:6px 12px;background:#1e1b33;color:#fff;font-size:12px;font-weight:700}
.pbar .t{white-space:nowrap}.pbar .t span{opacity:.6;font-weight:500}
.pbar .seg{display:flex;background:#3a3558;border-radius:9px;padding:2px;margin-left:auto}
.pbar .seg button{padding:4px 9px;border-radius:7px;color:#cfcbe8}.pbar .seg button.on{background:#fff;color:#1e1b33}
.pbar .th{padding:4px;border-radius:8px;background:#3a3558;display:grid}
@media(max-width:520px){.pbar .t span{display:none}}

/* Gerüst */
.shell{display:flex;max-width:1180px;margin:0 auto}
.side{display:none}
main{flex:1;min-width:0;padding:14px 14px 96px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:2px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom));z-index:15}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 4px;font-size:11px;font-weight:700;color:var(--muted);border-radius:12px;position:relative}
.tabs button.on{color:var(--brand-t);background:var(--soft)}
.tabs .desk{display:none}
.nb{position:absolute;top:2px;left:calc(50% + 4px);min-width:17px;height:17px;padding:0 4px;border-radius:99px;background:var(--bad);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center}
@media(min-width:900px){
  .tabs{display:none}
  .side{display:flex;flex-direction:column;gap:4px;width:214px;flex:none;padding:20px 12px;position:sticky;top:36px;height:calc(100vh - 36px)}
  .side .logo{font-weight:800;font-size:18px;padding:0 10px 14px;display:flex;align-items:center;gap:8px}
  .side button{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;font-weight:700;color:var(--muted);text-align:left;position:relative}
  .side button.on{background:var(--soft);color:var(--brand-t)}
  .side .nb{position:static;margin-left:auto}
  .side .who{margin-top:auto;padding:10px;border-top:2px solid var(--line);display:flex;gap:10px;align-items:center}
  main{padding:22px 24px 40px}
}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sec-h{display:flex;align-items:center;gap:8px;margin:18px 2px 8px}
.sec-h h2{margin:0}.sec-h .cnt{color:var(--muted);font-weight:600;font-size:13px}

/* Bausteine */
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 3px 0 var(--edge);margin-bottom:14px}
.list>.row{padding:10px 0;border-bottom:1px solid var(--line)}
.list>.row:first-of-type{padding-top:2px}.list>.row:last-child{border-bottom:0;padding-bottom:2px}
button.row{width:100%;text-align:left}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:9px 14px;border-radius:12px;font-weight:800;background:var(--brand);color:#fff;box-shadow:0 3px 0 var(--brand-d);white-space:nowrap}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--brand-d)}
.btn.sm{min-height:36px;padding:6px 11px;font-size:13.5px;border-radius:10px}
.btn.sec{background:var(--soft);color:var(--ink);box-shadow:0 3px 0 var(--edge)}
.btn.ok{background:var(--ok);box-shadow:0 3px 0 var(--ok-d)}
.btn.bad{background:var(--bad);box-shadow:0 3px 0 var(--bad-d)}
.btn.warn{background:var(--warn);color:#2a1c00;box-shadow:0 3px 0 var(--warn-d)}
.btn.info{background:var(--info);box-shadow:0 3px 0 var(--info-d)}
.btn.wide{width:100%}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;background:var(--soft);font-size:12px;font-weight:700;white-space:nowrap}
.chip[class*=c-]{background:color-mix(in srgb,var(--c) 16%,var(--card));color:var(--ct)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.filter{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px;scrollbar-width:none}
.filter::-webkit-scrollbar{display:none}
.filter button{flex:none;padding:6px 12px;border-radius:99px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:13px;display:flex;gap:6px;align-items:center}
.filter button.on{background:var(--brand);border-color:var(--brand-d);color:#fff}
.filter button em{font-style:normal;opacity:.65;font-weight:600}
.tile{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c,var(--brand)) 16%,var(--card));color:var(--ct,var(--c,var(--brand)))}
.ava{width:44px;height:44px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:24px;flex:none}
.ava.sm{width:34px;height:34px;font-size:18px}.ava.xl{width:64px;height:64px;font-size:36px}
.pts{font-weight:800;color:var(--brand-t);font-size:13.5px}
.late{color:var(--bad-t);font-weight:700}
.bar{display:block;height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin:4px 0 2px}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.bar.ok i{background:var(--ok)}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;padding:8px 6px;border-radius:10px;font-weight:700;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 0 var(--edge)}
.inp{width:100%;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);margin-bottom:10px}
.sw{width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;flex:none}
.sw i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--ok)}.sw.on i{left:21px}
.icb{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--soft);flex:none}

/* Heute */
.hero{display:flex;gap:14px;align-items:center;background:var(--brand);color:#fff;border-radius:20px;padding:14px;box-shadow:0 4px 0 var(--brand-d);margin-bottom:10px}
.hero h1{font-size:19px}.hero p{margin:2px 0 8px;font-size:13.5px;opacity:.92}
.hero .chip{background:rgba(255,255,255,.2);color:#fff}
.ringw{position:relative;flex:none;display:grid;place-items:center}
.ringw b{position:absolute;font-size:17px;font-weight:800}.ringw b small{display:inline;color:inherit;opacity:.8;font-size:11px}
.ring circle{fill:none;stroke-width:8;stroke-linecap:round}
.ring .rbg{stroke:rgba(255,255,255,.28)}.ring .rfg{stroke:#fff}
.strip{display:flex;gap:8px;align-items:center;padding:9px 12px;border-radius:12px;font-weight:700;font-size:13.5px;margin-bottom:8px;background:color-mix(in srgb,var(--c) 15%,var(--card));color:var(--ct)}
details.card summary{cursor:pointer;font-weight:800;display:flex;gap:8px;align-items:center;list-style:none}
details.card summary::-webkit-details-marker{display:none}
details.card[open] summary{margin-bottom:8px}

/* Fotos */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.ph{aspect-ratio:4/3;border-radius:12px;display:grid;place-items:center;position:relative;color:#fff;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 55%,#6b6880),color-mix(in srgb,var(--c) 30%,#3d3a52))}
.ph.after{background:linear-gradient(135deg,color-mix(in srgb,var(--c) 85%,#fff),var(--c))}
.ph span{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.55);font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:6px;letter-spacing:.04em;text-transform:uppercase}
.ph .ic{width:34px;height:34px;opacity:.85}
.pair.big .ph{aspect-ratio:1/1}
.reacts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rc{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:99px;border:2px solid var(--line);font-size:14px;font-weight:700;min-height:32px}
.rc.on{border-color:var(--brand);background:var(--soft)}
.rc.ghost{color:var(--muted)}
.cmts{margin-top:8px;font-size:13.5px}.cmts p{margin:4px 0}

/* Übersicht */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.kpi{display:flex;gap:10px;align-items:center;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:0 3px 0 var(--edge)}
.kpi b{font-size:22px;font-weight:800;line-height:1.1;display:block}.kpi b small{display:inline;font-size:13px}
.people{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pcell{display:flex;gap:8px;align-items:center;text-align:left;padding:8px;border-radius:14px;background:var(--bg);border:2px solid var(--line);min-width:0}
.pcell .n{color:var(--muted);font-size:12.5px;font-weight:600}
.pcell small[class*=c-]{color:var(--ct);font-weight:700}
.matrix{width:100%;border-collapse:collapse;font-size:13px}
.matrix th{font-size:11.5px;color:var(--muted);font-weight:700;padding:0 0 6px}
.matrix th.now{color:var(--brand-t)}
.matrix td{padding:4px 0;text-align:center}.matrix td:first-child{text-align:left;font-weight:700;white-space:nowrap}
.dot{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;color:#fff;vertical-align:middle}
.dot.ok{background:var(--ok)}.dot.teil{background:var(--warn)}.dot.miss{background:var(--bad)}.dot.frei{background:var(--info)}
.dot.future{border:2px dashed var(--line)}
.dot.now{background:conic-gradient(var(--brand) var(--p),var(--soft) 0);position:relative}
.dot.now::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--card)}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:11.5px;color:var(--muted)}
.legend .dot{width:12px;height:12px;margin-right:4px}
.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:900px){
  .kpis{grid-template-columns:repeat(4,1fr)}
  .cols{display:grid;grid-template-columns:1.15fr 1fr;gap:14px;align-items:start}
  .quick{grid-template-columns:repeat(5,1fr)}
  .feed{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;align-items:start}
  .feed .day{grid-column:1/-1}
  .narrow{max-width:680px}
}
.rank{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--soft);flex:none}
.rank.r1{background:#f6c443;color:#4a3500}.rank.r2{background:#c9ccd6;color:#2b2e3a}.rank.r3{background:#e2a36b;color:#40230a}
.num{font-size:18px;font-weight:800}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.stats div{background:var(--soft);border-radius:12px;padding:8px 4px;text-align:center}
.stats b{display:block;font-size:17px;font-weight:800}

/* Sheet + Toast */
.sheet-bg{position:fixed;inset:0;background:rgba(12,10,25,.55);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:540px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:22px}}
.sh-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}.sh-head h2{margin:0;font-size:18px;flex:1}
.btns3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hint{font-size:12.5px;color:var(--muted);margin:10px 0 0}
.empty{text-align:center;padding:20px 0}.empty h2{justify-content:center;font-size:18px;margin:8px 0 4px}.empty .btn{margin-top:14px}
.step{display:flex;align-items:center;gap:14px;justify-content:center;margin:6px 0 12px}.step b{font-size:26px;font-weight:800;min-width:56px;text-align:center}
label.f{display:block;font-weight:700;font-size:13px;margin:12px 0 6px}
.pick{display:flex;gap:6px;flex-wrap:wrap}
.pick button{padding:6px 10px;border-radius:12px;border:2px solid var(--line);font-weight:700;font-size:13.5px}
.pick button.on{border-color:var(--brand);background:var(--soft)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1e1b33;color:#fff;padding:11px 16px;border-radius:14px;font-weight:700;z-index:50;max-width:90vw;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.rain{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.rain span{position:absolute;top:-50px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(calc(100vh + 80px)) rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.rain{display:none}}
</style>
</head>

    ${photos(x.room)}<div class="reacts" id="re-${x.id}">${reactsHtml(x.id)}</div><div class="cmts" id="cm-${x.id}" hidden>${(C[x.id] || []).map(c => `<p><b>${mem(c.by).name}:</b> ${c.text}</p>`).join('')}<input class="inp" style="margin:6px 0 0" placeholder="Kommentar schreiben"></div></article>`; };
  let last = '';
  return `<div class="top"><h1 class="grow">Fotos</h1>${S.role === 'admin' && queue().length ? `<button class="btn sm" data-a="review">${ic('eye', 's')}${queue().length} prüfen</button>` : ''}</div>
  <div class="filter"><button class="${S.who === 'alle' ? 'on' : ''}" data-a="who" data-v="alle">${ic('users', 's')}Alle</button>${M.map(m => `<button class="${S.who === m.id ? 'on' : ''}" data-a="who" data-v="${m.id}">${m.emoji} ${m.name}</button>`).join('')}</div>
  <div class="feed">${items.map(x => (x.day !== last ? (last = x.day, `<div class="sec-h day"><h2>${x.day}</h2></div>`) : '') + post(x)).join('') || '<p class="sub">Noch keine Fotos.</p>'}</div>`;
}

// ---------- Rangliste ----------
function vRank() {
  const f = { heute: 'today', woche: 'week', monat: 'month' }[S.rank];
  const ms = [...M].sort((a, b) => b[f] - a[f]), max = Math.max(1, ms[0][f]);
  const sumW = M.reduce((s, m) => s + m.week, 0), sumG = M.reduce((s, m) => s + m.goal, 0);
  const fair = m => { const q = (m.week / sumW) / (m.goal / sumG); return q >= 1.1 ? chip('ok', 'flame', 'Mehr als genug') : q >= .8 ? chip('brand', 'thumbs-up', 'Passt') : q >= .5 ? chip('warn', 'hourglass', 'Da geht noch was') : chip('bad', 'circle-alert', 'Faultier-Alarm'); };
  return `<div class="narrow"><div class="top"><h1>Rangliste</h1></div>
  <div class="seg">${[['heute', 'Heute'], ['woche', 'Woche'], ['monat', 'Monat']].map(([k, l]) => `<button class="${S.rank === k ? 'on' : ''}" data-a="rank" data-v="${k}">${l}</button>`).join('')}</div>
  <section class="card list">${ms.map((m, i) => `<div class="row"><span class="rank r${i + 1}">${i + 1}</span><span class="ava sm">${m.emoji}</span><div class="grow"><b>${m.name}</b>${i === 0 && S.rank === 'woche' ? ' ' + chip('warn', 'crown', 'führt') : ''}<span class="bar"><i style="width:${100 * m[f] / max}%"></i></span></div><span class="num">${m[f]}</span></div>`).join('')}</section>
  <section class="card list"><h2>${ic('scale')}Fair-O-Meter <small style="font-weight:500">gemessen am eigenen Tagesziel</small></h2>${M.map(m => `<div class="row"><span class="grow">${m.emoji} <b>${m.name}</b></span>${fair(m)}</div>`).join('')}</section>
  <section class="card list"><h2>Belohnungen & Abmahnungen</h2>
    <div class="row"><span class="tile c-ok">${ic('star')}</span><div class="grow"><b>Lily: Ohne Meckern geholfen</b><small>heute 16:30 · +5 P</small></div></div>
    <div class="row"><span class="tile c-bad">${ic('triangle-alert')}</span><div class="grow"><b>Alex: Töpfe stehen gelassen</b><small>Mittwoch · −3 P</small></div></div>
    <div class="row"><span class="tile c-info">${ic('tree-palm')}</span><div class="grow"><b>Iris: freier Tag</b><small>Montag</small></div></div></section></div>`;
}

// ---------- Ich ----------
function vMe() {
  const m = me(), li = (i, t, s, a = 'noop', v = '') => `<button class="row" data-a="${a}" data-v="${v}"><span class="icb">${ic(i)}</span><span class="grow"><b>${t}</b>${s ? `<small>${s}</small>` : ''}</span>${ic('chevron-right')}</button>`;
  return `<div class="narrow"><section class="card"><div class="row"><span class="ava xl">${m.emoji}</span><div class="grow"><h1>${m.name}</h1><div class="chips" style="margin-top:4px">${chip('brand', m.role === 'admin' ? 'shield-check' : 'user', ROLE[m.role])}</div></div></div>
    <div class="stats"><div><b>${m.today}/${m.goal}</b><small>heute</small></div><div><b>${m.week}</b><small>Woche</small></div><div><b>${m.streak}</b><small>Tage Serie</small></div><div><b>${m.bank}</b><small>im Konto</small></div></div></section>
  <section class="card list">${li('history', 'Meine Punkte', 'Alle Einträge, Belohnungen und Abzüge')}${li('smile', 'Mein Emoji & Emoji-Regen', m.emoji + ' · 🎉✨⭐')}${li('bell', 'Benachrichtigungen', 'Waschtag, Tagesziel, Reaktionen')}${li('lightbulb', 'Aufgabe vorschlagen', 'Geht an die Admins')}</section>
  <section class="card list">${S.role === 'admin' ? li('settings', 'Verwaltung', 'Aufgaben, Familie, Regeln, Protokoll', 'tab', 'verwaltung') : ''}${li('monitor-smartphone', 'App aufs Handy legen')}${li('log-out', 'Person wechseln')}</section></div>`;
}

// ---------- Verwaltung (Admin) ----------
function vAdmin() {
  const tabs = [['aufgaben', 'Aufgaben'], ['familie', 'Familie'], ['regeln', 'Regeln'], ['protokoll', 'Protokoll']];
  const sw = on => `<button class="sw${on ? ' on' : ''}" data-a="sw" aria-label="an/aus"><i></i></button>`;
  let body = '';
  if (S.adm === 'aufgaben') body = `<input class="inp" data-search placeholder="Aufgabe suchen"><div class="filter"><button class="${S.room === 'alle' ? 'on' : ''}" data-a="room" data-v="alle">Alle <em>${T.length}</em></button>${Object.keys(ROOMS).filter(r => T.some(t => t.room === r)).map(r => `<button class="${S.room === r ? 'on' : ''}" data-a="room" data-v="${r}">${ic(ROOMS[r].ic, 's')}${r}</button>`).join('')}</div>
    <section class="card list">${T.filter(t => S.room === 'alle' || t.room === S.room).map(t => `<div class="row" data-t="${t.title.toLowerCase()}"><span class="tile" style="--c:${ROOMS[t.room].c}">${ic(ROOMS[t.room].ic)}</span><div class="grow"><b>${t.title}</b><small>${t.freq} · ${t.min} Min · ${t.pts} P${t.easy ? ' · auch für Kinder' : ''}</small></div><button class="icb" data-a="noop" aria-label="Bearbeiten">${ic('pencil', 's')}</button>${sw(t.active)}</div>`).join('')}</section>
    <button class="btn wide" data-a="noop">${ic('plus', 's')}Neue Aufgabe</button>`;
  if (S.adm === 'familie') body = `<section class="card list">${M.map(m => `<button class="row" data-a="person" data-v="${m.id}"><span class="ava">${m.emoji}</span><span class="grow"><b>${m.name}</b> ${chip('brand', '', ROLE[m.role])}<small>${m.info}</small></span>${ic('chevron-right')}</button>`).join('')}</section>
    <div class="quick"><button class="btn" data-a="noop">${ic('user-plus', 's')}Person hinzufügen</button><button class="btn sec" data-a="noop">${ic('qr-code', 's')}Einladen</button></div>`;
  if (S.adm === 'regeln') body = `<section class="card list">${RULES.map(([i, t, v]) => `<div class="row"><span class="icb">${ic(i)}</span><span class="grow"><b>${t}</b></span>${typeof v === 'boolean' ? sw(v) : `<span class="chip">${v}</span>`}</div>`).join('')}</section>`;
  if (S.adm === 'protokoll') body = `<p class="sub" style="margin-bottom:10px">Jede Änderung mit Uhrzeit und Person. Eigene Admin-Aktionen lassen sich zurücknehmen.</p><section class="card list">${LOG.map((l, i) => `<div class="row"><span class="ava sm">${mem(l.who).emoji}</span><div class="grow"><b>${mem(l.who).name}</b> ${l.text}<small>${l.t}</small></div>${l.undo ? `<button class="btn sec sm" data-a="undo" data-v="${i}">${ic('undo-2', 's')}Zurück</button>` : ''}</div>`).join('')}</section>`;
  return `<div class="narrow"><div class="top"><h1 class="grow">Verwaltung</h1><button class="btn sec sm" data-a="tab" data-v="uebersicht">${ic('layout-dashboard', 's')}Übersicht</button></div>
  <div class="seg">${tabs.map(([k, l]) => `<button class="${S.adm === k ? 'on' : ''}" data-a="adm" data-v="${k}">${l}</button>`).join('')}</div>${body}</div>`;
}

// ---------- Sheets ----------
const sheet = html => { $('#sheet').innerHTML = `<div class="sheet-bg"><div class="sheet">${html}</div></div>`; };
const closeSheet = () => { $('#sheet').innerHTML = ''; A = null; };
const head = (t, extra = '') => `<div class="sh-head"><h2>${t}</h2>${extra}<button class="icb" data-a="close" aria-label="Schließen">${ic('x', 's')}</button></div>`;
function sReview() {
  const q = queue();
  if (!q.length) return sheet(`<div class="empty"><span class="tile c-ok" style="width:72px;height:72px;margin:0 auto;border-radius:22px">${ic('circle-check', 'big')}</span><h2>Alles geprüft</h2><p class="sub">Keine neuen Fotos mehr.</p><button class="btn" data-a="close">Fertig</button></div>`);
  const t = q[0], m = mem(t.by);
  sheet(`${head('Fotos prüfen', chip('brand', '', q.length + ' offen'))}
    <div class="row"><span class="ava sm">${m.emoji}</span><div class="grow"><b>${t.title}</b><small>${m.name} · ${t.at} · ${t.dur} Min · +${t.pts} P</small></div></div>${photos(t.room, true)}
    <div class="btns3"><button class="btn ok" data-a="rv" data-v="ok">${ic('check', 's')}Passt</button><button class="btn warn" data-a="rv" data-v="nach">${ic('rotate-ccw', 's')}Nochmal</button><button class="btn bad" data-a="rv" data-v="no">${ic('x', 's')}Ablehnen</button></div>
    <p class="hint">Nochmal: Aufgabe geht mit kurzem Hinweis zurück, Punkte bleiben erst mal stehen. Ablehnen: Punkte weg, Aufgabe wieder offen.</p>`);
}
function sPerson(id) {
  const m = mem(id), [c, i, t] = mStatus(m), done = T.filter(x => x.state === 'done' && x.by === id);
  const a = (k, icn, l, cls) => `<button class="btn ${cls}" data-a="act" data-v="${k}|${id}">${ic(icn, 's')}${l}</button>`;
  sheet(`${head(`${m.emoji} ${m.name}`, chip(c, i, t))}
    <div class="stats" style="margin:0 0 12px"><div><b>${m.today}/${m.goal}</b><small>heute</small></div><div><b>${m.week}</b><small>Woche</small></div><div><b>${m.streak}</b><small>Tage Serie</small></div><div><b>${m.bank}</b><small>im Konto</small></div></div>
    <div class="list"><h2>Heute erledigt</h2>${done.map(x => `<div class="row"><span class="tile" style="--c:${ROOMS[x.room].c}">${ic(ROOMS[x.room].ic)}</span><div class="grow"><b>${x.title}</b><small>${x.at} · ${x.dur} Min</small></div><span class="pts">+${x.pts}</span></div>`).join('') || '<p class="sub">Heute noch nichts.</p>'}</div>
    <label class="f">Aktionen</label><div class="quick">${a('bonus', 'star', 'Belohnung', 'ok')}${a('warn', 'triangle-alert', 'Abmahnung', 'bad')}${a('frei', 'tree-palm', 'Frei geben', 'info')}${a('assign', 'clipboard-list', 'Zuweisen', '')}
      <button class="btn sec" data-a="noop">${ic('calendar-off', 's')}Abwesend</button><button class="btn sec" data-a="noop">${ic('key-round', 's')}PIN neu</button></div>`);
}
const KIND = {
  bonus: { t: 'Belohnung geben', btn: 'ok', pts: 5, ph: 'z. B. Ohne Meckern die Küche gerettet', go: 'Belohnen' },
  warn: { t: 'Abmahnung', btn: 'bad', pts: 3, ph: 'z. B. Töpfe wieder stehen gelassen', go: 'Abmahnen' },
  frei: { t: 'Frei geben', btn: 'info', when: true, ph: 'Grund (optional)', go: 'Frei geben' },
  assign: { t: 'Aufgabe zuweisen', btn: '', pts: 3, when: true, ph: 'Was ist zu tun?', go: 'Zuweisen' },
  durchsage: { t: 'Durchsage an alle', btn: '', all: true, ph: 'z. B. Um 17 Uhr kommt Besuch, bitte Wohnzimmer!', go: 'Senden' },
};
function sAction() {
  const k = KIND[A.kind];
  sheet(`${head(k.t)}
    ${k.all ? '<p class="sub">Geht als Benachrichtigung an alle Handys.</p>' : `<label class="f">Für wen?</label><div class="pick">${M.map(m => `<button class="${A.pid === m.id ? 'on' : ''}" data-a="apick" data-v="${m.id}">${m.emoji} ${m.name}</button>`).join('')}</div>`}
    ${k.when ? `<label class="f">Wann?</label><div class="pick">${['Heute', 'Morgen', 'Übermorgen'].map(w => `<button class="${A.when === w ? 'on' : ''}" data-a="awhen" data-v="${w}">${w}</button>`).join('')}</div>` : ''}
    ${k.pts ? `<label class="f">Punkte</label><div class="step"><button class="btn sec sm" data-a="apts" data-v="-1">−</button><b>${A.kind === 'warn' ? '−' : '+'}${A.pts}</b><button class="btn sec sm" data-a="apts" data-v="1">+</button></div>` : ''}
    <label class="f">${A.kind === 'assign' ? 'Aufgabe' : A.kind === 'durchsage' ? 'Nachricht' : 'Warum?'}</label><input class="inp" id="areason" placeholder="${k.ph}" value="${A.text || ''}">
    <button class="btn wide ${k.btn}" data-a="ago">${k.go}</button>`);
}

// ---------- Aktionen ----------
const ACT = {
  noop() { toast('Im Konzept nur angedeutet'); },
  role(v) { S.role = v; S.me = { admin: 'dorina', mitglied: 'mia', kind: 'lily' }[v]; S.tab = v === 'admin' ? 'uebersicht' : 'heute'; S.room = 'alle'; draw(); },
  theme() { const d = document.documentElement; d.dataset.theme = d.dataset.theme === 'dark' ? 'light' : 'dark'; drawChrome(); },
  tab(v) { S.tab = v; S.room = 'alle'; draw(); scrollTo(0, 0); },
  room(v) { S.room = v; draw(); }, who(v) { S.who = v; draw(); }, rank(v) { S.rank = v; draw(); }, adm(v) { S.adm = v; S.room = 'alle'; draw(); },
  sw(_, b) { b.classList.toggle('on'); },
  start(v) { const t = T.find(x => x.id === v); t.state = 'run'; t.by = S.me; t.since = 0; toast('Vorher-Foto ist drin. Los geht’s!'); draw(); },
  finish(v) { const t = T.find(x => x.id === v), m = me(); t.state = 'done'; t.at = hhmm(); t.dur = t.since || 1; t.check = 'neu'; m.today += t.pts; m.week += t.pts; m.month += t.pts; rain(['🎉', '✨', '⭐', m.emoji]); toast(`Sauber! +${t.pts} Punkte`); draw(); },
  join(v) { const t = T.find(x => x.id === v); t.helpers = [...(t.helpers || []), S.me]; toast(`Du hilfst ${mem(t.by).name} mit. Punkte werden geteilt.`); draw(); },
  mstart(v) { MINE[S.me].find(x => x.id === v).state = 'run'; toast('Vorher-Foto ist drin. Los geht’s!'); draw(); },
  mfinish(v) { const x = MINE[S.me].find(y => y.id === v), m = me(); x.state = 'done'; m.today += x.pts; m.week += x.pts; rain(['🎉', '✨', m.emoji]); toast(`Sauber! +${x.pts} Punkte`); draw(); },
  extra() { toast('Extra-Aufgabe: Dreck gesehen oder gekocht'); },
  react(v) { const [id, e] = v.split('|'); const w = (R[id] ??= {})[e] ??= []; const i = w.indexOf(S.me); i < 0 ? w.push(S.me) : w.splice(i, 1); $('#re-' + id).innerHTML = reactsHtml(id); },
  addreact(v) { const box = $('#re-' + v); if (box.dataset.open) { delete box.dataset.open; box.innerHTML = reactsHtml(v); return; } box.dataset.open = 1; box.innerHTML = REACTS.map(e => `<button class="rc${((R[v] || {})[e] || []).includes(S.me) ? ' on' : ''}" data-a="pickreact" data-v="${v}|${e}">${e}</button>`).join(''); },
  pickreact(v) { delete $('#re-' + v.split('|')[0]).dataset.open; ACT.react(v); },
  cmt(v) { const c = $('#cm-' + v); c.hidden = !c.hidden; },
  review: sReview,
  rv(v) { const t = queue()[0], m = mem(t.by); if (v === 'ok') t.check = 'ok'; if (v === 'nach') { t.check = 'nach'; log(`hat „${t.title}“ von ${m.name} zum Nachbessern zurückgegeben`); } if (v === 'no') { m.today -= t.pts; m.week -= t.pts; log(`hat „${t.title}“ von ${m.name} abgelehnt (−${t.pts} P)`); Object.assign(t, { state: 'open', by: null, check: null }); } draw(); sReview(); },
  person: sPerson,
  props() { sheet(`${head('Vorschläge')}<div class="list">${P.map(p => `<div class="row"><span class="ava sm">${mem(p.by).emoji}</span><div class="grow"><b>${p.title}</b><small>von ${mem(p.by).name} · ${p.info}</small></div><button class="btn ok sm" data-a="prop" data-v="ok|${p.id}" aria-label="Annehmen">${ic('check', 's')}</button><button class="btn sec sm" data-a="prop" data-v="no|${p.id}" aria-label="Ablehnen">${ic('x', 's')}</button></div>`).join('') || '<p class="sub">Keine offenen Vorschläge.</p>'}</div>`); },
  prop(v) { const [d, id] = v.split('|'), p = P.find(x => x.id === id); P = P.filter(x => x.id !== id); log(`hat den Vorschlag „${p.title}“ ${d === 'ok' ? 'angenommen' : 'abgelehnt'}`); toast(d === 'ok' ? 'Angenommen, ist jetzt im Plan' : 'Abgelehnt'); draw(); ACT.props(); },
  late() { sheet(`${head('Liegengeblieben')}<div class="list">${lateOpen().map(t => `<div class="row"><span class="tile" style="--c:${ROOMS[t.room].c}">${ic(ROOMS[t.room].ic)}</span><div class="grow"><b>${t.title}</b><small>${t.room} · <span class="late">${t.late}</span> · +${t.pts} P</small></div><button class="btn sm" data-a="act" data-v="assign||${t.title}">Zuweisen</button></div>`).join('') || '<p class="sub">Nichts liegengeblieben.</p>'}</div><p class="hint">Tipp: Zuweisen schickt der Person eine Benachrichtigung, die Aufgabe steht dann bei ihr unter „Meins“.</p>`); },
  act(v) { const [kind, pid, text] = v.split('|'); A = { kind, pid: pid || 'mia', pts: KIND[kind].pts || 0, when: 'Heute', text: text || '' }; sAction(); },
  apick(v) { A.text = $('#areason').value; A.pid = v; sAction(); }, awhen(v) { A.text = $('#areason').value; A.when = v; sAction(); },
  apts(v) { A.text = $('#areason').value; A.pts = Math.max(1, Math.min(30, A.pts + +v)); sAction(); },
  ago() { const txt = $('#areason').value.trim(), m = mem(A.pid), k = A.kind; if (!txt && k !== 'frei') return $('#areason').focus();
    if (k === 'bonus') { m.today += A.pts; m.week += A.pts; log(`hat ${m.name} eine Belohnung gegeben: +${A.pts} P „${txt}“`); toast(`${m.name} bekommt +${A.pts} Punkte`); rain(['⭐', '🌟', '🏆']); }
    if (k === 'warn') { m.week -= A.pts; log(`hat ${m.name} abgemahnt: −${A.pts} P „${txt}“`); toast(`Abmahnung an ${m.name}`); }
    if (k === 'frei') { log(`hat ${m.name} ${A.when.toLowerCase()} frei gegeben`); toast(`${m.name} hat ${A.when.toLowerCase()} frei`); }
    if (k === 'assign') { (MINE[m.id] ??= []).push({ id: 'm' + Date.now(), title: txt, note: 'von Dorina zugewiesen', pts: A.pts, state: 'open', icon: 'clipboard-list' }); log(`hat ${m.name} „${txt}“ zugewiesen`); toast(`${m.name} hat es jetzt auf der Liste`); }
    if (k === 'durchsage') { log(`hat eine Durchsage geschickt: „${txt}“`); toast('Durchsage ist raus'); }
    closeSheet(); draw(); },
  undo(v) { const l = LOG.splice(+v, 1)[0]; toast('Zurückgenommen'); draw(); },
  close: closeSheet,
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]');
  if (!b) { if (e.target.classList.contains('sheet-bg')) closeSheet(); return; }
  (ACT[b.dataset.a] || ACT.noop)(b.dataset.v, b);
});
document.addEventListener('input', e => {
  if (!e.target.matches('[data-search]')) return;
  const q = e.target.value.toLowerCase();
  document.querySelectorAll('[data-t]').forEach(r => r.hidden = !r.dataset.t.includes(q));
});
function draw() {
  drawChrome();
  $('#view').innerHTML = ({ uebersicht: vOverview, heute: vToday, fotos: vPhotos, rang: vRank, ich: vMe, verwaltung: vAdmin }[S.tab] || vToday)();
}
document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
draw();
</script>
</body>
</html>
